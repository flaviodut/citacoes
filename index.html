<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citações</title>
    <meta name="author" content="Flávio Dutra">
    <meta name="subject" content="hobby">
    <meta name="Description" content="As melhores frases soltas dos personagens que marcam o dia-a-dia da empresa.">
    <meta name="Keywords" content="citação, trabalho, dilbert">
    <meta name="Geography" content="Av. Paulista, 2522 - Ap. 42B - Consolação, São Paulo - SP, 01310-300">
    <meta name="Language" content="Portuguese">
    <meta name="Copyright" content="Flávio Dutra">
    <meta name="distribution" content="Local">
    <meta name="Robots" content="index,follow">
    <meta name="city" content="São Paulo">
    <meta name="country" content="Brasil">
    <link href="//fonts.googleapis.com/css?family=Lora:400,400i,700,700i|Roboto:400" rel="stylesheet">
    <style>
      .loading {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100vw;
        height: 100vh;
        background-color: white;
      }

      .loading__spinner {
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
      }

      .loading__circle {
        stroke-dasharray: 90;
        stroke-dashoffset: 0;
        stroke-linecap: round;
        animation: dash 1.5s ease-in-out infinite;
      }

      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes dash {
        0% {
          stroke-dasharray: 1, 150;
          stroke-dashoffset: 0;
        }
        50% {
          stroke-dasharray: 90, 150;
          stroke-dashoffset: -35;
        }
        100% {
          stroke-dasharray: 90, 150;
          stroke-dashoffset: -124;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loading">
      <svg class="loading__spinner" viewBox="0 0 50 50">
        <circle class="loading__circle" cx="25" cy="25" r="20" fill="none" stroke="#008EAE" stroke-width="4"></circle>
      </svg>
    </div>
    <header id="header" class="header">
      <h1 class="title">&#8220;Citações&#8221;</h1>
      <nav id="nav" class="nav">
        <ul>
          <li>
            <a id="buttonViewOther" class="btn__view-other" href="javascript:;" title="Ver outra citação">
              <i class="icon-refresh"></i>
              <span>Ver outra</span>
            </a>
          </li>
          <li>
            <a id="buttonViewAll" class="btn__view-all" href="javascript:;" title="Ver todos as ">
              <i class="icon-globe"></i>
              <span>Ver todas</span>
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <article id="article" class="article"></article>
    <aside id="egg" class="egg">
      <img class="egg__icon" src="/images/egg.svg" alt="Egg">
      <span class="egg__message">Digite "zezim"</span>
    </aside>
    <div id="zezim" class="zezim">
      <img src="/images/salsicha.gif" alt="Salsichadas na cara">
      <img src="/images/banana.gif" alt="Banana" style="display:none;">
      <audio id="nyanCat" src="/audio/nyan-cat.mp3" preload></audio>
    </div>
    <div id="modal" class="modal">
      <div class="modal__content">
        <a id="modalClose" class="modal__close" href="javascript:;" title="Fechar">✖</a>
        <div id="modalBody" class="modal__body"></div>
      </div>
      <div class="modal__overlay"></div>
    </div>
    <footer id="footer" class="footer">
      <p>Citações coletadas por <b>Flávio Dutra</b></p>
    </footer>
    <script type="module" src="/main.js"></script>
  </body>
</html>
